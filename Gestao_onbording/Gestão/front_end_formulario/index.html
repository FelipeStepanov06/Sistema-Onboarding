<!DOCTYPE html>
<html lang="UTF-8">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Onboarding Service</title>
    <link rel="stylesheet" href="main.css">
    <script src="https://kit.fontawesome.com/5b65f0748c.js" crossorigin="anonymous"></script>
</head>
<body>
    
    <div class="dados_gerais">


        <div class="dados_gerais_inicial">
            <!--- Primeiro titulo, contendo o icone ficha tecnica-->
            <div class="ficha_tecnica">
                <i class="fa-regular fa-file-lines ficha-inscricao"></i>
                <span>Ficha de Inscrição</span>            
            </div>
            <hr class="linha_divisoria_inicial">

            <div class="dados_pessoais">
                <span>Dados Pessoais</span>            
            </div>

            <!-- Campos dividindo por linha -->
            <div class="campos_formulario">
                
                <label>Nome</label>
                <div class="caixa_input">
                    <i class="fa-solid fa-user perfil"></i>
                    <input type="text" class="entrada_texto" placeholder="Digite seu Nome Completo">
                </div>
            </div>

            <div class="campos_formulario">
                <label>E-mail</label> 
                <div class="caixa_input">
                <i class="fa-solid fa-envelope envelope"></i>
                <input type="email" class="entrada_texto" placeholder="Digite seu E-mail!">
                </div>
            </div>

            <div class="campos_formulario">
                <label>CPF</label>
                <div class="caixa_input">
                <i class="fa-solid fa-id-card cpf_icon"></i>
                <input type="text" class="entrada_texto" placeholder="Digtite seu CPF">
                </div>
            </div>

            <div class="campos_formulario">
                <label>Data de Nascimento</label>
                <div class="caixa_input">
                <i class="fa-solid fa-calendar calendario"></i>
                <input type="data" class="entrada_texto" placeholder="Data de nascimento">
                </div>
            </div>
        </div>

        <div class="dados_gerais_final">
            <div class="dados_pessoais">
                <span>Histórico Profissional</span>            
            </div>

            <div class="campos_formulario">
                <label>Ultima Empresa</label>
                <div class="caixa_input">
                <i class="fa-solid fa-building construcao"></i>
                <input type="text" class="entrada_texto" placeholder="Digtite sua ultima empresa">
                </div>
            </div>
            
            <div class="campos_formulario">
                <label>Ultimo Cargo</label>
                <div class="caixa_input">
                <i class="fa-solid fa-user-tie ult_cargo"></i>
                <input type="text" class="entrada_texto" placeholder="Digtite sua ultima posição">
                </div>
            </div>

            <div class="campos_formulario">
                <label>Anos de Experiência</label>
                <div class="caixa_input">
                    <i class="fa-solid fa-business-time tempo_experiencia"></i>
                    <select class="entrada_texto">
                        <option value="padrao">Selecione</option>
                        <option value="&lt1"> &lt1</option>
                        <option value="1-3">1-3</option>
                        <option value="3-5">3-5</option>
                        <option value="5-10">5-10</option>
                        <option value="10+">10+</option>
                    </select>
                </div>
            </div>
        </div>    


        <div class="dados_gerais_final">
            <div class="dados_pessoais">
                <span>Outros Dados</span>
            </div> 
            <div class="campos_formulario">
                <label>Upload Curriculo</label>
                <div class="campos_formulario_outro">
                    <label for="upload_curriculo" class="caixa_upload">
                    <i class="fa-solid fa-upload"></i>
                    </label>
                <input type="file" accept=".pdf" id="upload_curriculo" class="upload_curriculo">
                </div>
            </div>
            
            <div class="campos_formulario">
                <label>Habilidades Principais</label>
                <div class="caixa_tags" id="containerTags">
                        <input type="text" id="inputHabilidade" placeholder="Digite a habilidade e aperte Enter..." class="input_tag_escondido" id="tag">
                </div>
            </div>
        </div>

        <hr class="linha_divisoria_final">

        <button class="inscricao">Enviar Inscrição</button>

        
    </div>
    <noscript>Ative seu javascript para o site ter uma melhor performance</noscript>
    <script src="app.js"></script>
</body>
</html>
