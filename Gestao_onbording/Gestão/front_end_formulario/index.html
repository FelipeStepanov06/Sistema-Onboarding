<!-- Formulário de inscrição de candidatos: coleta de dados e envio à API. -->
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ficha de Inscrição - RecrutaWeb</title>

    <!-- Folha de estilos principal do formulário -->
    <link rel="stylesheet" href="main.css">

    <!-- Biblioteca de ícones Font Awesome -->
    <script src="https://kit.fontawesome.com/5b65f0748c.js" crossorigin="anonymous"></script>
</head>
<body>

<!-- Contêiner principal da página -->
<div class="pagina_form">

    <!-- Cabeçalho com identificação visual da aplicação -->
    <header class="form_header">
        <div class="form_logo">
            <!-- Logotipo simplificado -->
            <div class="logo_icone"><i class="fa-solid fa-r"></i></div>
            <span>RecrutaWeb</span>
        </div>
    </header>

    <!-- Contêiner principal do formulário -->
    <main class="dados_gerais">

        <!-- Título do formulário -->
        <div class="ficha_tecnica">
            <i class="fa-regular fa-file-lines"></i>
            <span>Ficha de Inscrição</span>
        </div>

        <!-- Linha divisória -->
        <hr class="linha_divisoria">

        <!-- Seção: Vaga de interesse -->
        <div class="secao_titulo">
            <i class="fa-solid fa-briefcase"></i>
            <span>Vaga de Interesse</span>
        </div>

        <div class="campos_grid cols_1">
            <div class="campo">
                <label for="select_vaga">Vaga <span class="obrigatorio">*</span></label>
                <div class="caixa_input" id="container_vaga">
                    <i class="fa-solid fa-briefcase"></i>
                    <!-- Opções preenchidas dinamicamente via requisição à API -->
                    <select id="select_vaga" class="entrada_texto">
                        <option value="">Carregando vagas disponíveis...</option>
                    </select>
                </div>
                <!-- Mensagem de indisponibilidade ou falha no carregamento de vagas -->
                <span class="aviso_vaga oculto" id="aviso_vaga"></span>
            </div>
        </div>

        <!-- Seção: Dados pessoais -->
        <div class="secao_titulo">
            <i class="fa-solid fa-user"></i>
            <span>Dados Pessoais</span>
        </div>

        <div class="campos_grid cols_2">
            <div class="campo">
                <label for="input_nome">Nome <span class="obrigatorio">*</span></label>
                <div class="caixa_input">
                    <i class="fa-solid fa-user"></i>
                    <input type="text" id="input_nome" class="entrada_texto" placeholder="Digite seu nome">
                </div>
            </div>

            <div class="campo">
                <label for="input_sobrenome">Sobrenome <span class="obrigatorio">*</span></label>
                <div class="caixa_input">
                    <i class="fa-solid fa-user"></i>
                    <input type="text" id="input_sobrenome" class="entrada_texto" placeholder="Digite seu sobrenome">
                </div>
            </div>

            <div class="campo">
                <label for="input_email">E-mail <span class="obrigatorio">*</span></label>
                <div class="caixa_input">
                    <i class="fa-solid fa-envelope"></i>
                    <input type="email" id="input_email" class="entrada_texto" placeholder="seu@email.com">
                </div>
            </div>

            <div class="campo">
                <label for="input_cpf">CPF <span class="obrigatorio">*</span></label>
                <div class="caixa_input">
                    <i class="fa-solid fa-id-card"></i>
                    <!-- Limite de 14 caracteres para a máscara de CPF (000.000.000-00) -->
                    <input type="text" id="input_cpf" class="entrada_texto" placeholder="000.000.000-00" maxlength="14">
                </div>
            </div>

            <div class="campo">
                <label for="input_data">Data de Nascimento <span class="obrigatorio">*</span></label>
                <div class="caixa_input">
                    <i class="fa-solid fa-calendar"></i>
                    <!-- Seletor de data de nascimento -->
                    <input type="date" id="input_data" class="entrada_texto">
                </div>
            </div>
        </div>

        <!-- Seção: Histórico profissional -->
        <div class="secao_titulo">
            <i class="fa-solid fa-building"></i>
            <span>Histórico Profissional</span>
        </div>

        <div class="campos_grid cols_3">
            <div class="campo">
                <label for="input_empresa">Última Empresa <span class="obrigatorio">*</span></label>
                <div class="caixa_input">
                    <i class="fa-solid fa-building"></i>
                    <input type="text" id="input_empresa" class="entrada_texto" placeholder="Nome da empresa">
                </div>
            </div>

            <div class="campo">
                <label for="input_cargo">Último Cargo <span class="obrigatorio">*</span></label>
                <div class="caixa_input">
                    <i class="fa-solid fa-user-tie"></i>
                    <input type="text" id="input_cargo" class="entrada_texto" placeholder="Seu cargo anterior">
                </div>
            </div>

            <div class="campo">
                <label for="select_experiencia">Anos de Experiência</label>
                <div class="caixa_input">
                    <i class="fa-solid fa-business-time"></i>
                    <select id="select_experiencia" class="entrada_texto">
                        <option value="">Selecione</option>
                        <option value="<1">Menos de 1 ano</option>
                        <option value="1-3">1 a 3 anos</option>
                        <option value="3-5">3 a 5 anos</option>
                        <option value="5-10">5 a 10 anos</option>
                        <option value="10+">Mais de 10 anos</option>
                    </select>
                </div>
            </div>
        </div>

        <!-- Seção: Informações complementares -->
        <div class="secao_titulo">
            <i class="fa-solid fa-paperclip"></i>
            <span>Outros Dados</span>
        </div>

        <div class="campos_grid cols_2">
            <div class="campo">
                <label>Upload Currículo</label>
                <!-- Rótulo estilizado vinculado ao campo de arquivo oculto -->
                <label for="upload_curriculo" class="caixa_upload" id="label_upload">
                    <i class="fa-solid fa-cloud-arrow-up"></i>
                    <span id="nome_arquivo">Clique para selecionar um arquivo PDF</span>
                </label>
                <input type="file" accept=".pdf" id="upload_curriculo" style="display:none">
            </div>

            <div class="campo">
                <label>Habilidades Principais</label>
                <!-- Contêiner dinâmico para inserção e remoção de tags -->
                <div class="caixa_tags" id="containerTags">
                    <input type="text" id="inputHabilidade" placeholder="Digite e pressione Enter..." class="input_tag">
                </div>
            </div>
        </div>

        <!-- Divisor de seção -->
        <hr class="linha_divisoria">

        <!-- Contêiner para mensagens de feedback de envio -->
        <div id="mensagem_feedback" class="mensagem_feedback oculto"></div>

        <!-- Rodapé: legenda e botão de submissão -->
        <div class="form_footer">
            <p class="legenda_obrigatorio"><span class="obrigatorio">*</span> Campos obrigatórios</p>
            <button class="btn_enviar" id="btn_inscricao">
                <i class="fa-solid fa-paper-plane"></i>
                Enviar Inscrição
            </button>
        </div>

    </main>
</div>

<!-- Alerta para navegadores com JavaScript desativado -->
<noscript>Ative seu JavaScript para o site funcionar corretamente.</noscript>

<!-- Script de controle e validação do formulário -->
<script src="app.js"></script>
</body>
</html>
